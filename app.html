<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FoundryKin</title>
<link rel="stylesheet" href="fk-style.css?v=0.8.51">
<link rel="stylesheet" href="fk-base.css?v=0.8.51">
</head>
<body>
<div id="top" class="fk-header fk-header--shell"><button class="fk-header-back" id="back" hidden data-i18n-attr="aria-label:ui.back"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></button><div class="t fk-header-bubble" id="title"></div><button class="fk-header-action" id="ok" hidden data-i18n="ui.add"></button></div>
<div id="screens">
<section class="screen on" id="s-home">
<button class="btn big" data-go="create" data-i18n="nav.create"></button>
<button class="btn big" data-go="settings" data-i18n="nav.settings"></button>
</section>
<section class="screen" id="s-create">
<h2 data-i18n="packs.title"></h2>
<div id="packList"></div>
<h2 data-i18n="packs.new"></h2>
<div class="col"><button class="btn pri" id="cGo" data-i18n="packs.create"></button><label class="btn" for="impF" data-i18n="packs.import"></label><input type="file" id="impF" accept=".mcpack,.zip,application/zip,application/octet-stream"></div>
</section>
<section class="screen" id="s-pack">
<div id="texList"></div>
</section>
<section class="screen" id="s-edit">
<p class="lbl" data-i18n="form.name"></p><input type="text" id="eName" autocapitalize="off" autocomplete="off" spellcheck="false">
<p class="lbl" data-i18n="form.author"></p><input type="text" id="eAuthor" autocomplete="off">
<p class="lbl" data-i18n="form.desc"></p><input type="text" id="eDesc">
<p class="lbl" data-i18n="form.version"></p><input type="text" id="eVer" placeholder="1.0.0">
<p class="lbl" data-i18n="form.game"></p><input type="text" id="eGame" placeholder="1.21.0">
<p class="lbl" data-i18n="form.icon"></p>
<div class="row" style="align-items:center"><img class="ico" id="eIco" alt=""><label class="btn" for="eIcoF" data-i18n="form.pick_png"></label><input type="file" id="eIcoF" accept="image/png,image/*"><button class="btn" id="eIcoX" data-i18n="form.remove"></button></div>
<div class="row"><button class="btn pri" id="eSave" data-i18n="form.save"></button></div>
<p class="lbl" data-i18n="form.manifest"></p>
<textarea id="eJson" readonly></textarea>
</section>
<section class="screen" id="s-add"><div id="addErr"></div><iframe id="editor" data-i18n-attr="title:editor.title"></iframe></section>
<section class="screen" id="s-settings">
<h2 data-i18n="settings.theme"></h2>
<select id="sTheme"><option value="auto" data-i18n="theme.auto"></option><option value="light" data-i18n="theme.light"></option><option value="dark" data-i18n="theme.dark"></option></select>
<h2 data-i18n="settings.language"></h2>
<select id="sLang"><option value="auto" data-i18n="lang.auto"></option><option value="en" data-i18n="lang.en"></option><option value="ru" data-i18n="lang.ru"></option></select>
<h2 data-i18n="settings.editor"></h2>
<p class="lbl" data-i18n="settings.editor_hint"></p>
<input type="text" id="sUrl" autocapitalize="off" autocomplete="off" spellcheck="false">
<div class="row"><button class="btn" id="sUrlSave" data-i18n="settings.save_address"></button></div>
<h2 data-i18n="settings.data"></h2>
<div class="row"><button class="btn" id="sExport" data-i18n="settings.export_data"></button><button class="btn" id="sClear" data-i18n="settings.clear"></button></div>
<h2 data-i18n="settings.trouble"></h2>
<div class="row"><button class="btn" id="sDiag" data-i18n="settings.diag"></button></div>
</section>
<section class="screen" id="s-diag">
<p class="lbl" data-i18n="diag.hint"></p>
<pre class="rep" id="dReport"></pre>
<div class="row"><button class="btn pri" id="dCopy" data-i18n="diag.copy"></button><button class="btn" id="dRefresh" data-i18n="diag.refresh"></button></div>
</section>
</div>
<div class="bar" id="bar"><button class="btn find" id="addBtn"><span data-i18n="ui.find"></span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button></div>
<div id="msg" role="status"></div>
<script>window.FK_V='0.8.51';</script>
<script src="fk-i18n.js?v=0.8.51"></script>
<script src="fk-editor.js?v=0.8.51"></script>
<script src="fk-app.js?v=0.8.51"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</body>
</html>
