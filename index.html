<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FoundryKin editor</title>
<style>
:root{--bg:#eceae4;--panel:#fbfaf7;--ink:#23262b;--mute:#6b6f76;--line:#d3d0c7;--acc:#3f7d4e;--accink:#fff;--stage:#cfd8dc}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--panel:#202327;--ink:#e8e6e1;--mute:#9a9ea5;--line:#33373d;--acc:#6fbf80;--accink:#10210f;--stage:#0f1113}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
main{max-width:460px;margin:0 auto;padding:14px 14px 28px}
.stage{position:relative;background:var(--stage);border-radius:14px;overflow:hidden;aspect-ratio:1/1;touch-action:pan-y}
.stage canvas{display:block;width:100%;height:100%}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1}
button{font:inherit;color:var(--ink);background:transparent;border:0;border-radius:8px;padding:9px 10px;min-height:40px;cursor:pointer}
button.on{background:var(--acc);color:var(--accink);font-weight:600}
button.ghost{background:var(--panel);border:1px solid var(--line)}
button:disabled{opacity:.4}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sec{margin-top:16px}
.lbl{font-size:13px;color:var(--mute);margin:0 0 6px}
#ed{width:100%;aspect-ratio:1/1;display:block;image-rendering:pixelated;touch-action:none;border-radius:10px;border:1px solid var(--line);
background:conic-gradient(#bbb 25%,#e6e6e6 0 50%,#bbb 0 75%,#e6e6e6 0) 0 0/24px 24px}
.pal{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);padding:0;min-height:0}
.sw.on{border-color:var(--ink)}
input[type=color]{width:42px;height:34px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
input[type=text]{width:100%;min-height:40px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
.btn{display:inline-flex;align-items:center;border-radius:8px;padding:9px 10px;min-height:40px;cursor:pointer}
#msg{font-size:13px;color:var(--mute);min-height:18px}
body.fk-search .fk-edit-part,body.fk-edit .fk-search-part{display:none!important}
</style>
</head>
<body class="fk-search">
<main>

<section class="sec fk-search-part" id="searchPart">
<input type="text" id="q" data-i18n-attr="placeholder:search.placeholder aria-label:search.placeholder" autocapitalize="off" autocomplete="off" spellcheck="false">
<div class="row" id="catLoad" hidden><label class="ghost btn" for="catfile" data-i18n="cat.load"></label><input type="file" id="catfile" accept=".json,application/json,text/plain" multiple></div>
</section>

<div class="stage fk-edit-part" id="stage"></div>
<div class="row fk-edit-part" id="shapesRow"><div class="seg" style="width:100%" id="shapes"></div></div>
<div class="seg fk-edit-part" id="slots"></div>
<div class="sec fk-edit-part"><canvas id="ed"></canvas></div>

<div class="sec fk-edit-part">
<div class="row" id="tools">
<div class="seg" style="flex:1"><button data-t="pen" class="on" data-i18n="tool.pen"></button><button data-t="erase" data-i18n="tool.erase"></button><button data-t="fill" data-i18n="tool.fill"></button><button data-t="pick" data-i18n="tool.pick"></button></div>
</div>
<div class="row">
<div class="seg"><button data-r="16" class="on">16</button><button data-r="32">32</button></div>
<button class="ghost" id="undo" data-i18n="ui.undo"></button><button class="ghost" id="redo" data-i18n="ui.redo"></button>
</div>
<div class="pal" id="pal"></div>
<div class="row">
<label class="ghost btn" for="file" data-i18n="ui.replace"></label>
<button class="ghost" id="clr" data-i18n="ui.clear"></button>
<button class="ghost" id="expPng" data-i18n="ui.download"></button>
<input type="file" id="file" accept="image/png,image/*">
</div>
<p id="msg"></p>
</div>

</main>
<script src="fk-i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="fk-core.js"></script>
</body>
</html>
