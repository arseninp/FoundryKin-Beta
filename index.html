<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FoundryKin editor</title>
<style>
body{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
main{max-width:460px;margin:0 auto;padding:14px 14px 28px}
body.fk-edit main{padding-top:var(--fk-header-reserve)}
body.fk-search main{padding:var(--fk-header-start) var(--fk-header-side) 28px}
.stage{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:14px;overflow:hidden;aspect-ratio:1/1;touch-action:pan-y}
.stage canvas{display:block;width:100%;height:100%}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1}
#shapes{height:auto;max-height:none;min-height:50px;flex-wrap:wrap;align-items:center;gap:4px;padding:4px;overflow:visible}
#shapes button{display:inline-flex;align-items:center;justify-content:center;flex:0 0 40px;width:40px;height:40px;min-width:40px;min-height:40px;margin:0;padding:7px;line-height:1}
#shapes button svg{display:block;flex:none;width:24px;height:24px;margin:0;pointer-events:none}
#slots{height:auto;max-height:none;min-height:50px;margin-top:12px;padding:4px;gap:4px;flex-wrap:nowrap;flex-direction:column;align-items:stretch;overflow:visible}
#slots button{display:inline-flex;align-items:center;justify-content:center;flex:1 1 auto;width:100%;height:auto;min-height:40px;min-width:0;max-width:100%;margin:0;padding:8px 10px;font-size:13px;font-weight:500;line-height:1.4;white-space:normal;overflow-wrap:anywhere}
#frames{display:none;align-items:center;gap:8px;margin-top:8px;padding:4px}
#frames button{flex:0 0 48px}
#frames span{flex:1 1 auto;text-align:center;font-size:13px;font-weight:500}
#shapesRow{margin:12px 0}
button{font:inherit;font-weight:800;color:var(--ink);background:transparent;border:0;border-radius:8px;padding:9px 10px;min-height:40px;cursor:pointer}
button.on{background:var(--acc);color:var(--accink)}
button.ghost,label.ghost{background:var(--panel);border:1px solid var(--line)}
button:disabled{opacity:.4}
button:active:not(:disabled),label.btn:active{filter:brightness(.9)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button svg{display:block;width:22px;height:22px;margin:0 auto;pointer-events:none}
.sec{margin-top:16px}
.lbl{font-size:13px;font-weight:400;color:var(--mute);margin:0 0 6px}
#ed{width:100%;aspect-ratio:1/1;display:block;image-rendering:pixelated;touch-action:none;border-radius:10px;border:1px solid var(--line);
background:conic-gradient(#bbb 25%,#e6e6e6 0 50%,#bbb 0 75%,#e6e6e6 0) 0 0/24px 24px}
input[type=text]{width:100%;min-height:40px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
.btn{display:inline-flex;align-items:center;font-weight:800;border-radius:8px;padding:9px 10px;min-height:40px;cursor:pointer}
#msg{font-size:13px;font-weight:400;color:var(--mute);margin:6px 0}#msg:empty{display:none}
body.fk-search .fk-edit-part,body.fk-edit .fk-search-part{display:none!important}
/* Find content; header components are defined only in fk-base.css. */
#searchPart{margin-top:0}
#fkSvc>.fkHelpBtn{width:auto;min-width:44px;padding:0 6px}
#fkGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.fkc{display:flex;flex-direction:column;gap:6px;padding:0;min-height:0;text-align:center}
.fkp{aspect-ratio:1/1;border-radius:12px;background:var(--panel);border:2px solid var(--line);overflow:hidden}
.fkp img{display:block;width:100%;height:100%;object-fit:contain}
.fkn{font-size:12px;font-weight:800;line-height:1.25;border-radius:8px;background:var(--panel);border:2px solid var(--line);padding:3px 6px;overflow:hidden;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fkc.fk-edited .fkp,.fkc.fk-edited .fkn{border-color:var(--red)}
#fkEmpty{grid-column:1/-1;color:var(--mute);font-size:13px;font-weight:400;padding:12px 4px}
#fkMore{height:1px}
/* tools panel */
.fkTrigOn{position:relative;z-index:101}
#toolsPanel{margin-top:10px}
#fkTop{display:flex;gap:6px;margin:8px 0}#fkTop button{flex:1 1 0;min-width:0;min-height:40px;padding:4px 0;background:var(--panel);border:1px solid var(--line)}#fkTop .fkGap{margin-left:8px}
#fkColors{display:flex;gap:6px;align-items:center;margin:8px 0}#fkPalBtn{flex:0 0 auto;width:44px;height:40px;min-height:0;padding:0;background:var(--panel);border:1px solid var(--line)}
#fkSwatches{display:flex;gap:6px;overflow-x:auto;flex:1 1 auto;min-width:0;min-height:38px;padding:2px 0}
.fkSw{flex:0 0 auto;width:34px;height:34px;min-height:0;padding:0;border-radius:8px;border:2px solid var(--line);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}.fkSw.on{border-color:var(--ink)}
.fkMenu{position:fixed;z-index:120;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.4);padding:4px;display:none}
.fkMenu button{display:block;width:100%;min-height:40px;padding:8px 16px;text-align:left;white-space:nowrap}
#tools{display:flex;flex-wrap:nowrap;gap:6px;margin:8px 0}#tools .seg{flex:1 1 auto;min-width:0}#tools .seg button{flex:1 1 0;min-width:0;padding:8px 0}
.fkPick{flex:0 0 auto;width:48px;margin-right:8px;padding:0;background:var(--panel);border:1px solid var(--line)}
#fkSvc{display:flex;flex-wrap:nowrap;gap:6px;margin:8px 0}#fkSvc>button,#fkSvc>label{flex:1 1 auto;min-width:0;min-height:40px;padding:9px 2px;font-size:12px;white-space:nowrap;justify-content:center}#fkSvc>.fkIconBtn{flex:0 0 auto;min-width:44px;padding:0 6px}
.fkBack{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}.fkBack.on{display:flex}
.fkSheet{width:100%;max-width:460px;max-height:90vh;overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;padding:12px 14px 18px}
.fkHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.fkOk{min-width:44px;font-size:20px;color:var(--acc);border:1px solid var(--line);background:transparent}
.fkSvW{position:relative;border-radius:10px;box-shadow:0 0 0 1px var(--line)}#fkSV{display:block;width:100%;height:170px;border-radius:10px;touch-action:none}
.fkMark{position:absolute;width:20px;height:20px;box-sizing:border-box;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #000;transform:translate(-50%,-50%);pointer-events:none}
.fkRow{display:flex;gap:10px;align-items:center;margin:12px 0}.fkPrev{flex:0 0 44px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line)}.fkSl{flex:1 1 auto;display:flex;flex-direction:column;gap:8px}
.fkR{-webkit-appearance:none;appearance:none;width:100%;height:24px;margin:0;padding:0;background:transparent;outline:none}
.fkR::-webkit-slider-runnable-track{height:16px;border-radius:8px;background:var(--fkT)}.fkR::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-4px;box-sizing:border-box;border-radius:50%;background:#fff;border:2px solid #444}
.fkR::-moz-range-track{height:16px;border-radius:8px;background:var(--fkT)}.fkR::-moz-range-thumb{width:24px;height:24px;box-sizing:border-box;border-radius:50%;background:#fff;border:2px solid #444}
.fkFld{display:flex;gap:8px}.fkFld label{flex:1 1 0;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:400;color:var(--mute);gap:4px}
.fkFld input{width:100%;min-height:36px;text-align:center;padding:4px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
#fkHex{width:100%;min-height:40px;margin-top:10px;text-align:center;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
</style>
<link rel="stylesheet" href="fk-base.css?v=0.8.67">
</head>
<body class="fk-search">
<main>

<section class="sec fk-search-part" id="searchPart">
<div class="fk-header fk-header--find">
<button class="fk-header-back" type="button" id="fkBack" data-i18n-attr="title:ui.back aria-label:ui.back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></button>
<div class="fk-header-field"><input type="text" id="q" data-i18n-attr="placeholder:search.placeholder aria-label:search.placeholder" autocapitalize="off" autocomplete="off" spellcheck="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></div>
<span class="fk-header-help" id="fkHelpSlot"></span>
</div>
<div class="row" id="catLoad" hidden><label class="ghost btn" for="catfile" data-i18n="cat.load"></label><input type="file" id="catfile" accept=".json,application/json,text/plain" multiple></div>
<div id="fkGrid"></div>
<div id="fkMore"></div>
</section>

<div class="stage fk-edit-part" id="stage"></div>
<div class="row fk-edit-part" id="shapesRow"><div class="seg" style="width:100%" id="shapes"></div></div>
<div class="seg fk-edit-part" id="slots"></div>
<div class="seg fk-edit-part" id="frames"><button type="button" id="fPrev" aria-label="previous frame">‹</button><span id="fNum"></span><button type="button" id="fNext" aria-label="next frame">›</button></div>
<div class="sec fk-edit-part"><canvas id="ed"></canvas></div>
<div class="fk-edit-part" id="toolsPanel"></div>
<p id="msg" class="fk-edit-part"></p>

</main>
<script src="fk-i18n.js?v=0.8.67"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="fk-catalog.js?v=0.8.67"></script>
<script src="fk-shapes.js?v=0.8.67"></script>
<script src="fk-sculk.js?v=0.8.67"></script>
<script src="fk-lights.js?v=0.8.67"></script>
<script src="fk-details.js?v=0.8.67"></script>
<script src="fk-fixtures.js?v=0.8.67"></script>
<script src="fk-core.js?v=0.8.67"></script>
<script src="fk-tools.js?v=0.8.67"></script>
<script src="fk-grid.js?v=0.8.67"></script>
<script src="fk-help.js?v=0.8.67"></script>
</body>
</html>
