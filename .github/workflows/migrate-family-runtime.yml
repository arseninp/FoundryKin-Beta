name: Activate resource-preserving families
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-family-runtime.yml'
      - 'tools/migrate-family-runtime.mjs'
permissions:
  contents: write
concurrency:
  group: migrate-family-runtime
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test before migration
        run: node --test tools/*.test.mjs
      - name: Apply complete source transition
        run: node tools/migrate-family-runtime.mjs
      - name: Derive generated test expectation from actual atlas
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const path='tools/family-runtime.test.mjs';
          const text=await readFile(path,'utf8');
          const before=" assert.equal(cat.cr.pale_moss_carpet,'textures/blocks/pale_moss_carpet_side');";
          const after=" const carriedKey=blocks.pale_moss_carpet.carried_textures;\n let carried=terrain.texture_data[carriedKey].textures;\n if(Array.isArray(carried))carried=carried[0];\n if(carried&&typeof carried==='object')carried=carried.path;\n assert.equal(typeof carried,'string');\n assert.ok(existing[carried],'carried texture file must exist');\n assert.equal(cat.cr.pale_moss_carpet,carried,'family binding must preserve the resolved carried texture');";
          assert.equal(text.split(before).length,2,'Expected exactly one incorrect test assertion');
          await writeFile(path,text.replace(before,after));
          NODE
      - name: Check syntax and integration tests
        run: |
          for file in fk-*.js; do node --check "$file"; done
          node --test tools/*.test.mjs
      - name: Commit only approved transition files
        run: |
          git add -- fk-catalog.js fk-core.js fk-fixtures.js app.html index.html tools/family-runtime.test.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'v0.8.87: activate resource-preserving families and remove legacy grouping'
          git push origin HEAD:main
