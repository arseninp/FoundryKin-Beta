name: Validate application and catalog
on:
  workflow_dispatch:
  push:
    branches: [main, refactor-0.9]
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.html'
      - '**/*.css'
      - 'data/**'
      - 'tools/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.html'
      - '**/*.css'
      - 'data/**'
      - 'tools/**'
      - '.github/workflows/validate.yml'
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check tracked source syntax, file limits and all tests
        run: node tools/validate.mjs
      - name: Report pinned catalog model assignments
        id: coverage
        if: ${{ !cancelled() }}
        run: node tools/model-coverage.mjs --chunks data/catalog-candidate --out model-coverage.json
      - name: Preserve model coverage diagnostics
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: model-coverage-${{ github.sha }}
          path: model-coverage.json
          if-no-files-found: error
          retention-days: 7
