name: Validate application and catalog
on:
  workflow_dispatch:
  push:
    branches: [main, refactor-0.9]
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.html'
      - '**/*.css'
      - 'data/**'
      - 'tools/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.html'
      - '**/*.css'
      - 'data/**'
      - 'tools/**'
      - '.github/workflows/validate.yml'
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check tracked source syntax, file limits and all tests
        run: node tools/validate.mjs
      - name: Report pinned catalog model assignments
        id: coverage
        if: ${{ !cancelled() }}
        run: node tools/model-coverage.mjs --chunks data/catalog-candidate --out model-coverage.json
      - name: Preserve model coverage diagnostics
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: model-coverage-${{ github.sha }}
          path: model-coverage.json
          if-no-files-found: error
          retention-days: 7
  preview-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Three.js only in runner temporary storage
        run: |
          mkdir -p "$RUNNER_TEMP/fk-preview-three"
          npm install --prefix "$RUNNER_TEMP/fk-preview-three" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund three@0.128.0
      - name: Compile pinned review slice and build real Three.js geometry without WebGL
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          import {join} from 'node:path';
          import {readCandidate} from './tools/model-coverage.mjs';
          import {compileReview, REVIEW_IDS, resourcePaths, previewControlSpec, previewControlSelection, previewTextureField} from './preview.mjs';
          import {createPreviewResolver} from './catalog/preview.mjs';
          const require = createRequire(join(process.env.RUNNER_TEMP, 'fk-preview-three', 'package.json'));
          const Three = require('three');
          assert.equal(Three.REVISION, '128');
          const input = readCandidate('data/catalog-candidate');
          const inputBefore = JSON.stringify(input);
          const {catalog, registry, coverage} = compileReview(input, Three);
          assert.equal(coverage.ready, true);
          const bedIds='white orange magenta light_blue yellow lime pink gray light_gray cyan purple blue brown green red black'.split(' ').map(color=>color+'_bed');
          assert.equal(new Set(REVIEW_IDS).size,REVIEW_IDS.length);
          assert.deepEqual(Object.keys(catalog.records).sort(),[...new Set([...REVIEW_IDS,...(REVIEW_IDS.includes('bed')?bedIds:[])])].sort());
          if(REVIEW_IDS.includes('bed'))assert.equal(catalog.aliases.bed,'red_bed');
          assert.ok(catalog.cards.includes('closed_eyeblossom'));
          assert.ok(!catalog.cards.includes('open_eyeblossom'));
          const bloomGroup = catalog.stateGroups.closed_eyeblossom;
          assert.equal(bloomGroup.parameter, 'bloom');
          assert.equal(bloomGroup.default, 'closed');
          assert.deepEqual({...bloomGroup.variants}, {closed:'closed_eyeblossom',open:'open_eyeblossom'});
          assert.deepEqual({...bloomGroup.models}, {closed:'cross',open:'emissive_cross'});
          const bloomPaths = [...new Set(['closed_eyeblossom','open_eyeblossom'].flatMap(id => catalog.records[id].paths))].sort();
          assert.deepEqual(bloomGroup.paths, bloomPaths);
          for (const path of bloomPaths) assert.ok(Object.hasOwn(input.existing, path), 'Missing eyeblossom resource: ' + path);
          const resolve = createPreviewResolver(catalog, registry, Three);
          const before = JSON.stringify(catalog);
          let checks = 0;
          const pot = catalog.records.decorated_pot, potFaces = ['north','south','east','west'];
          assert.ok(pot);
          assert.equal(catalog.cards.filter(id => id === 'decorated_pot').length, 1);
          assert.equal(pot.model, 'decorated_pot');
          const potPatterns = pot.potteryPatterns;
          assert.equal(Object.keys(potPatterns).length, 24);
          assert.equal(new Set(Object.values(potPatterns)).size, 24);
          assert.equal(potPatterns.brick, 'textures/blocks/decorated_pot_side');
          const potBase = 'textures/blocks/decorated_pot_base';
          assert.deepEqual(pot.bindings, {side:[potPatterns.brick],base:[potBase]});
          for (const path of [potBase,...Object.values(potPatterns)]) {
           assert.ok(pot.paths.includes(path), 'Unowned pot resource: ' + path);
           assert.ok(Object.hasOwn(input.existing, path), 'Missing pinned pot resource: ' + path);
           assert.ok(catalog.resources[path].some(owner => owner.kind === 'block' && owner.id === 'decorated_pot'));
          }
          let potGeometry;
          const conduitRecord = catalog.records.conduit, conduitParts = conduitRecord.conduitParts;
          assert.equal(conduitRecord.model, 'conduit');
          assert.equal(catalog.cards.filter(id => id === 'conduit').length, 1);
          assert.equal(Object.keys(conduitParts).length, 6);
          assert.equal(new Set(Object.values(conduitParts)).size, 6);
          assert.equal(conduitParts.base, 'textures/blocks/conduit_base');
          for (const path of Object.values(conduitParts)) {
           assert.ok(conduitRecord.paths.includes(path));
           assert.ok(Object.hasOwn(input.existing, path));
           assert.ok(catalog.resources[path].some(owner => owner.kind === 'block' && owner.id === 'conduit'));
          }
          const conduitShapes = new Map();
          function conduitShape(node) {
           const shape = {position:node.position.toArray(),rotation:node.rotation.toArray(),children:node.children.map(conduitShape)};
           if (node.isMesh) shape.geometry = {position:Array.from(node.geometry.attributes.position.array),uv:Array.from(node.geometry.attributes.uv.array)};
           return shape;
          }
          function check(request) {
           const plan = resolve(request), group = new Three.Group(), textures = Object.create(null);
           const liquid = plan.model === 'water' || plan.model === 'lava', semi = plan.model === 'water';
           for (const path of resourcePaths(plan)) {
            assert.ok(Object.hasOwn(input.existing, path), 'Missing pinned resource: ' + path);
            const texture = new Three.DataTexture(new Uint8Array([255,255,255,semi ? 128 : 255]), 1, 1, Three.RGBAFormat);
            texture.userData = {...texture.userData, semi};texture.needsUpdate = true;textures[path] = texture;
           }
           let borrowedDisposals = 0;
           const replacementTextures = Object.create(null);
           if (plan.model === 'conduit' || liquid) for (const texture of Object.values(textures)) texture.addEventListener('dispose', () => borrowedDisposals++);
           let instance;
           try {
            instance = plan.instantiate({group}, textures);
            let meshes = 0;
            const modelMaterials = [];
            group.traverse(node => {
             if (node.isMesh) {meshes++;assert.ok(node.geometry?.attributes.position?.count > 0);modelMaterials.push(...(Array.isArray(node.material) ? node.material : [node.material]));}
            });
            assert.ok(meshes > 0, 'Empty preview: ' + request.id);
            if (!request.state) assert.equal(plan.object.id, catalog.aliases[request.id] ?? request.id);
            if (plan.model==='chest') {
             assert.equal(meshes,3);
             const sheet=textures[plan.bindings[plan.state.double?'double_sheet':'sheet']];
             assert.ok(modelMaterials.every(material=>material.isMeshLambertMaterial===true&&material.map===sheet));
            }
            if (plan.object.card === 'closed_eyeblossom') {
             const open = plan.state.bloom === 'open';
             assert.equal(plan.model, open ? 'emissive_cross' : 'cross');
             assert.equal(meshes, open ? 4 : 2);
             assert.equal(modelMaterials.filter(material => material.isMeshBasicMaterial === true).length, open ? 2 : 0);
             assert.equal(modelMaterials.filter(material => material.isMeshLambertMaterial === true).length, 2);
            }
            if (plan.model === 'decorated_pot') {
             assert.equal(meshes, 18);
             assert.equal(modelMaterials.length, 18);
             for (let index = 0; index < potFaces.length; index++) assert.equal(modelMaterials[index].map, textures[plan.bindings[potFaces[index]]]);
             for (const material of modelMaterials.slice(4)) assert.equal(material.map, textures[potBase]);
             assert.ok(modelMaterials.every(material => material.isMeshLambertMaterial === true));
             const shape = [];
             group.traverse(node => {
              if (node.isMesh) shape.push({position:Array.from(node.geometry.attributes.position.array),uv:Array.from(node.geometry.attributes.uv.array),offset:node.position.toArray(),rotation:node.rotation.toArray()});
             });
             const snapshot = JSON.stringify(shape);
             potGeometry ??= snapshot;
             assert.equal(snapshot, potGeometry, 'Pot geometry or UV changed with pattern/slot');
            }
            if (plan.model === 'conduit') {
             const active = plan.state.active;
             assert.equal(meshes, active ? 4 : 6);
             assert.ok(modelMaterials.every(material => material.isMeshLambertMaterial === true));
             const expected = active ? [textures[plan.bindings.cage],textures[plan.bindings.wind],textures[plan.bindings.wind],textures[plan.bindings.eye]] : Array(6).fill(textures[conduitParts.base]);
             assert.deepEqual(modelMaterials.map(material => material.map), expected);
             assert.ok(modelMaterials.every(material => material.side === (active ? Three.DoubleSide : Three.FrontSide)));
             const key = active ? 'active_' + plan.state.wind : 'inactive', snapshot = JSON.stringify(conduitShape(group));
             if (conduitShapes.has(key)) assert.equal(snapshot, conduitShapes.get(key), 'Conduit shape changed with eye/PNG');
             else conduitShapes.set(key, snapshot);
             for (const path of Object.keys(textures)) {
              const next = new Three.DataTexture(new Uint8Array([128,128,128,255]), 1, 1, Three.RGBAFormat);
              next.userData = {...next.userData,semi:false};next.needsUpdate = true;
              next.addEventListener('dispose', () => borrowedDisposals++);replacementTextures[path] = next;
             }
             instance.update(replacementTextures);
             const updated = [];
             group.traverse(node => {if (node.isMesh) updated.push(...(Array.isArray(node.material) ? node.material : [node.material]));});
             const expectedUpdated = active ? [replacementTextures[plan.bindings.cage],replacementTextures[plan.bindings.wind],replacementTextures[plan.bindings.wind],replacementTextures[plan.bindings.eye]] : Array(6).fill(replacementTextures[conduitParts.base]);
             assert.deepEqual(updated.map(material => material.map), expectedUpdated);
             assert.ok(updated.every(material => material.side === (active ? Three.DoubleSide : Three.FrontSide)));
             assert.equal(JSON.stringify(conduitShape(group)), snapshot);
            }
            if (liquid) {
             const water = plan.model === 'water';
             assert.equal(meshes, 6);
             assert.equal(plan.state.level, request.state?.level ?? 0);
             const height = new Three.Box3().setFromObject(group).getSize(new Three.Vector3()).y;
             assert.ok(Math.abs(height - (8-plan.state.level)/9) < 1e-6);
             assert.deepEqual(Object.keys(plan.bindings).sort(), ['down','east','north','south','up','west']);
             assert.ok(modelMaterials.every(material => (water ? material.isMeshLambertMaterial : material.isMeshBasicMaterial) === true));
             assert.ok(modelMaterials.every(material => material.transparent === water && material.depthWrite === !water && material.alphaTest === (water ? 0 : .05)));
             assert.deepEqual(new Set(modelMaterials.map(material => material.map)), new Set(Object.values(textures)));
             const snapshot = JSON.stringify(conduitShape(group));
             for (const path of Object.keys(textures)) {
              const next = new Three.DataTexture(new Uint8Array([128,128,128,water ? 255 : 128]), 1, 1, Three.RGBAFormat);
              next.userData = {...next.userData,semi:!water};next.needsUpdate = true;
              next.addEventListener('dispose', () => borrowedDisposals++);replacementTextures[path] = next;
             }
             instance.update(replacementTextures);
             assert.deepEqual(new Set(modelMaterials.map(material => material.map)), new Set(Object.values(replacementTextures)));
             assert.ok(modelMaterials.every(material => material.transparent === !water && material.depthWrite === water && material.alphaTest === (water ? .05 : 0)));
             assert.ok(modelMaterials.every(material => (water ? material.isMeshLambertMaterial : material.isMeshBasicMaterial) === true));
             assert.equal(JSON.stringify(conduitShape(group)), snapshot);
            }
            checks++;
           } finally {
            try {instance?.dispose();if (plan.model === 'conduit' || liquid) assert.equal(borrowedDisposals, 0, 'Borrowed preview textures were disposed');}
            finally {for (const texture of [...Object.values(textures),...Object.values(replacementTextures)]) texture.dispose();}
           }
           assert.equal(group.children.length, 0);
           return plan;
          }
          for (const id of REVIEW_IDS) check({id});
          for (const source of ['closed_eyeblossom','open_eyeblossom']) for (const bloom of ['closed','open']) for (const slot of bloomPaths) {
           const plan = check({id:source,state:{bloom},slot});
           assert.equal(plan.object.card, 'closed_eyeblossom');
           assert.equal(plan.object.id, bloomGroup.variants[bloom]);
           assert.equal(plan.slot, slot);
           assert.equal(plan.state.bloom, bloom);
           const controls = previewControlSpec(catalog, plan);
           assert.equal(controls.state.bloom, bloom);
           assert.equal(controls.schema.length, 1);
           assert.equal(controls.schema[0].key, 'bloom');
           assert.deepEqual(controls.schema[0].values.map(option => option.value), ['closed','open']);
           assert.deepEqual(controls.schema[0].values.map(option => option.label), [['Closed','Закрытый'],['Open','Открытый']]);
          }
          for (const variant of ['plain','carved','lit']) for (const stem of [false,true]) for (const facing of ['north','south','east','west']) check({id:'pumpkin',state:{variant,stem,facing}});
          for (const stem of [false,true]) for (const facing of ['north','south','east','west']) check({id:'melon_block',state:{stem,facing}});
          for (let stage = 0; stage < 8; stage++) check({id:'melon_stem',state:{stage}});
          for (const growth of ['small','medium','large','cluster']) for (const face of ['up','down','north','south','east','west']) check({id:'budding_amethyst',state:{crystals:true,growth,face}});
          for (const tall of [false,true]) for (const variant of ['a','b']) check({id:'seagrass',state:{tall,variant}});
          for (const hanging of [false,true]) for (let age = 0; age < 5; age++) check({id:'mangrove_propagule',state:{hanging,age}});
          const plainPot = resolve({id:'decorated_pot'});
          assert.deepEqual(plainPot.state.patterns, Object.fromEntries(potFaces.map(face => [face,'brick'])));
          const plainControls = previewControlSpec(catalog, plainPot);
          assert.deepEqual(plainControls.schema.map(field => field.key), potFaces.map(face => 'pattern_' + face));
          assert.deepEqual(previewTextureField(plainPot).values.map(option => option.value), pot.paths);
          for (const field of plainControls.schema) {
           assert.deepEqual(field.values.map(option => option.value), Object.keys(potPatterns));
           assert.ok(field.values.every(option => option.label.length === 2 && option.label.every(text => typeof text === 'string' && text.length > 0)));
          }
          for (const face of potFaces) for (const pattern of Object.keys(potPatterns)) {
           const values = {...plainControls.state,['pattern_' + face]:pattern,texture:plainPot.slot};
           const selection = previewControlSelection(plainPot, values);
           assert.equal(selection.slot, plainPot.slot);
           assert.ok(!Object.keys(selection.state).some(key => key.startsWith('pattern_') || key === 'texture' || key === 'form'));
           const plan = check({id:'decorated_pot',...selection});
           for (const side of potFaces) {
            const expected = side === face ? pattern : 'brick';
            assert.equal(plan.state.patterns[side], expected);
            assert.equal(plan.bindings[side], potPatterns[expected]);
           }
           const controls = previewControlSpec(catalog, plan);
           assert.equal(controls.state['pattern_' + face], pattern);
          }
          const mixedPatterns = {north:'angler_pottery_sherd',south:'skull_pottery_sherd',east:'guster_pottery_sherd',west:'scrape_pottery_sherd'};
          const mixed = resolve({id:'decorated_pot',state:{patterns:mixedPatterns}});
          const mixedControls = previewControlSpec(catalog, mixed);
          for (const slot of pot.paths) {
           const values = {...mixedControls.state,texture:slot};
           const selection = previewControlSelection(mixed, values);
           const plan = check({id:'decorated_pot',...selection});
           assert.equal(plan.slot, slot);
           assert.deepEqual(plan.state.patterns, mixedPatterns);
           assert.deepEqual(resourcePaths(plan).sort(), [...new Set([potBase,...Object.values(mixedPatterns).map(pattern => potPatterns[pattern])])].sort());
           assert.deepEqual(previewControlSpec(catalog, plan), mixedControls);
          }
          for (const patterns of [null,[],{up:'brick'},{north:'unknown'}]) assert.throws(() => resolve({id:'decorated_pot',state:{patterns}}));
          const incompleteInventory = {...input.existing};
          delete incompleteInventory[potPatterns.angler_pottery_sherd];
          assert.throws(() => compileReview({...input,existing:incompleteInventory}, Three), /Missing decorated pot source texture/);
          const inactiveConduit = resolve({id:'conduit'});
          assert.deepEqual(inactiveConduit.state, {active:false,eye_open:false,wind:'horizontal'});
          assert.deepEqual(resourcePaths(inactiveConduit), [conduitParts.base]);
          const conduitControls = previewControlSpec(catalog, inactiveConduit);
          assert.deepEqual(conduitControls.schema.map(field => field.key), ['active','eye_open','wind']);
          assert.deepEqual(conduitControls.schema.map(field => field.values.map(option => option.value)), [[false,true],[false,true],['horizontal','vertical']]);
          assert.deepEqual(previewTextureField(inactiveConduit).values.map(option => option.value), conduitRecord.paths);
          for (const field of conduitControls.schema) assert.ok(field.values.every(option => option.label.length === 2 && option.label.every(text => typeof text === 'string' && text.length > 0)));
          for (const active of [false,true]) for (const eye_open of [false,true]) for (const wind of ['horizontal','vertical']) for (const slot of conduitRecord.paths) {
           const selected = {active,eye_open,wind};
           const selection = previewControlSelection(inactiveConduit, {...selected,texture:slot});
           assert.deepEqual(selection.state, selected);
           const plan = check({id:'conduit',...selection});
           assert.equal(plan.slot, slot);
           assert.deepEqual(plan.state, selected);
           assert.deepEqual(plan.bindings, active ? {cage:conduitParts.cage,eye:conduitParts[eye_open?'eye_open':'eye_closed'],wind:conduitParts['wind_'+wind]} : {up:conduitParts.base});
           assert.deepEqual(previewControlSpec(catalog, plan).state, selected);
           const next = resolve({id:'conduit',state:plan.state,slot:conduitParts.base});
           assert.deepEqual(next.bindings, plan.bindings);
          }
          assert.equal(conduitShapes.size, 3);
          assert.notEqual(conduitShapes.get('active_horizontal'), conduitShapes.get('active_vertical'));
          for (const state of [{active:1},{eye_open:'open'},{wind:'bad'}]) assert.throws(() => resolve({id:'conduit',state}), /Invalid conduit preview state/);
          const missingConduitInventory = {...input.existing};
          delete missingConduitInventory[conduitParts.cage];
          assert.throws(() => compileReview({...input,existing:missingConduitInventory}, Three), /Missing conduit source texture/);
          const liquidIds = ['water','flowing_water','lava','flowing_lava'];
          for (const id of liquidIds) {
           const record = catalog.records[id], plain = resolve({id}), model = id.includes('water') ? 'water' : 'lava';
           assert.equal(record.model, model);
           assert.equal(plain.object.id, id);
           assert.equal(plain.state.level, 0);
           const controls = previewControlSpec(catalog, plain);
           assert.deepEqual(controls.schema.map(field => field.key), ['level']);
           assert.deepEqual(controls.schema[0].label, ['Liquid level','Уровень жидкости']);
           assert.deepEqual(controls.schema[0].values.map(option => option.value), [0,1,2,3,4,5,6,7]);
           assert.deepEqual(previewTextureField(plain).values.map(option => option.value), record.paths);
           for (const path of record.paths) {
            assert.ok(Object.hasOwn(input.existing, path));
            assert.ok(catalog.resources[path].some(owner => owner.kind === 'block' && owner.id === id));
           }
           for (let level = 0; level < 8; level++) for (const slot of record.paths) {
            const selection = previewControlSelection(plain, {level,texture:slot});
            assert.deepEqual(selection.state, {level});
            assert.equal(selection.slot, slot);
            const plan = check({id,...selection});
            assert.equal(plan.object.id, id);
            assert.equal(plan.slot, slot);
            assert.deepEqual(plan.bindings, plain.bindings);
            assert.equal(previewControlSpec(catalog, plan).state.level, level);
           }
           for (const level of [-1,8,1.5,'0',true,false,NaN,Infinity,{},[]]) assert.throws(() => resolve({id,state:{level}}), /Invalid liquid preview level/);
          }
          for (const id of REVIEW_IDS.filter(id=>catalog.records[id].model==='chest')) {
           const target=catalog.aliases[id]??id,record=catalog.records[target],plain=resolve({id});
           assert.equal(plain.object.id,target);
           assert.deepEqual(previewControlSpec(catalog,plain).schema.map(field=>field.key),target==='ender_chest'?['open']:['open','double']);
           for (const open of [false,true]) for (const double of (target==='ender_chest'?[false]:[false,true])) for (const slot of record.paths) {
            const state={open,double},selection=previewControlSelection(plain,{...state,texture:slot}),plan=check({id,...selection});
            assert.equal(plan.object.id,target);assert.equal(plan.slot,slot);assert.deepEqual(plan.state,state);
            const role=double?'double_sheet':'sheet';assert.deepEqual(plan.bindings,{[role]:record.bindings[role][0]});
           }
          }
          assert.throws(()=>resolve({id:'ender_chest',state:{double:true}}),/no double/);
          assert.equal(JSON.stringify(input), inputBefore);
          assert.equal(JSON.stringify(catalog), before);
          console.log(JSON.stringify({source:input.source,sourceRecords:Object.keys(catalog.records).length,cards:catalog.cards.length,modelTypes:registry.ids().length,geometryChecks:checks,limits:'Synthetic one-pixel textures; no PNG/TGA, UV, WebGL or Android acceptance'},null,2));
          NODE
