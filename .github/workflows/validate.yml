name: Validate application and catalog
on:
  workflow_dispatch:
  push:
    branches: [main, refactor-0.9]
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.html'
      - '**/*.css'
      - 'data/**'
      - 'tools/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.html'
      - '**/*.css'
      - 'data/**'
      - 'tools/**'
      - '.github/workflows/validate.yml'
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check tracked source syntax, file limits and all tests
        run: node tools/validate.mjs
