name: Finalize accepted catalog stage
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-catalog-stage.yml'
      - 'tools/finalize-catalog-stage.mjs'
permissions:
  contents: write
concurrency:
  group: finalize-catalog-stage
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test accepted application
        run: node --test tools/*.test.mjs
      - name: Update five documents and remove only completed migrations
        run: node tools/finalize-catalog-stage.mjs
      - name: Check remaining scripts and tests
        run: |
          for file in fk-*.js; do node --check "$file"; done
          node --test tools/*.test.mjs
          git diff --exit-code -- '*.js' '*.html' '*.css'
      - name: Commit only documentation and bounded cleanup
        run: |
          git add -A -- CONTEXT.md TODO.md ARCHITECTURE.md README.md ROADMAP.md tools/migrate-catalog-loader.mjs tools/migrate-family-runtime.mjs tools/migrate-pale-moss.mjs .github/workflows/migrate-catalog-loader.yml .github/workflows/migrate-family-runtime.yml .github/workflows/migrate-pale-moss.yml tools/finalize-catalog-stage.mjs .github/workflows/finalize-catalog-stage.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: close accepted 0.8.88 stage and remove completed migrations'
          git push origin HEAD:main
