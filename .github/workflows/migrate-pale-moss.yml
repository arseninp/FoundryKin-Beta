name: Complete pale moss preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-pale-moss.yml'
      - 'tools/migrate-pale-moss.mjs'
permissions:
  contents: write
concurrency:
  group: migrate-pale-moss
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test accepted baseline
        run: node --test tools/*.test.mjs
      - name: Apply connected preview change
        run: node tools/migrate-pale-moss.mjs
      - name: Validate syntax, states and actual resources
        run: |
          for file in fk-*.js; do node --check "$file"; done
          node --test tools/*.test.mjs
      - name: Save only approved files
        run: |
          git add -- fk-catalog.js fk-core.js fk-fixtures.js fk-view.js fk-model-state.js app.html index.html tools/pale-moss.test.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'v0.8.88: complete pale moss preview states and side textures'
          git push origin HEAD:main
