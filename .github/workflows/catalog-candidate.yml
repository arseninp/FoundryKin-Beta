name: Build catalog candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-candidate.yml'
      - 'tools/**'
      - 'catalog/**'
      - 'models/**'
      - 'preview-controls.mjs'
permissions:
  contents: write
concurrency:
  group: catalog-candidate-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test catalog tools
        run: node --test tools/*.test.mjs
      - name: Read pinned official sources
        uses: actions/checkout@v4
        with:
          repository: Mojang/bedrock-samples
          ref: 46ba6ea985fb5a92d79a9419198f10dda14c199d
          path: .catalog-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            resource_pack/blocks.json
            resource_pack/textures/terrain_texture.json
            resource_pack/textures/item_texture.json
            metadata/vanilladata_modules/mojang-blocks.json
      - name: Build review-only catalog candidate
        run: node tools/build-catalog-candidate.mjs .catalog-source data/catalog-candidate
      - name: Validate generated catalog and icon links before saving
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readCandidate} from './tools/model-coverage.mjs';
          import {compileModelCatalog} from './models/library.mjs';
          import {createThreeMock} from './tools/three-mock.mjs';
          const input = readCandidate('data/catalog-candidate');
          const {catalog} = compileModelCatalog(input, createThreeMock());
          assert.ok(Object.keys(catalog.items).length > 0);
          for (const id of ['acacia_door','standing_sign','red_bed','light_gray_bed']) assert.ok(catalog.records[id].icons.length > 0, 'Missing item icon: ' + id);
          assert.deepEqual(catalog.records.light_gray_bed.icons, ['textures/items/bed_silver']);
          console.log(JSON.stringify({source:input.source,records:Object.keys(catalog.records).length,cards:catalog.cards.length,items:Object.keys(catalog.items).length}));
          NODE
      - name: Save only generated candidate data
        run: |
          git add -A -- data/catalog-candidate
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: record pinned catalog candidate for review'
          git push origin HEAD:main
