<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FoundryKin v0.7.0</title>
<style>
:root{--bg:#eceae4;--panel:#fbfaf7;--ink:#23262b;--mute:#6b6f76;--line:#d3d0c7;--acc:#3f7d4e;--accink:#fff}
:root[data-theme=dark]{--bg:#16181b;--panel:#202327;--ink:#e8e6e1;--mute:#9a9ea5;--line:#33373d;--acc:#6fbf80;--accink:#10210f}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:1px solid var(--line);background:var(--panel);min-height:52px}
#top .t{flex:1;font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top .t small{color:var(--mute);font-weight:400;font-size:12px;margin-left:6px}
#screens{flex:1;min-height:0;position:relative}
.screen{display:none;position:absolute;inset:0;overflow:auto;padding:12px 14px 90px;max-width:520px;margin:0 auto;width:100%}
.screen.on{display:block}
#s-add{padding:0;max-width:none}
#s-add iframe{width:100%;height:100%;border:0;display:block}
h2{font-size:16px;margin:14px 0 8px}
.lbl{font-size:13px;color:var(--mute);margin:10px 0 4px}
input[type=text],select{width:100%;min-height:40px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
.btn{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.btn.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.big{display:flex;width:100%;min-height:72px;font-size:19px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
.card b{display:block}
.card.click{cursor:pointer}
.tx{display:flex;gap:10px;align-items:center}
.tx img{width:56px;height:56px;image-rendering:pixelated;border:1px solid var(--line);border-radius:6px;background:#bbb;flex:none}
.tx div{flex:1;min-width:0;word-break:break-all}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:none}
.bar.on{display:block}
.bar .btn{width:100%;max-width:492px;margin:0 auto;display:flex;min-height:52px;font-size:16px}
#msg{position:fixed;left:14px;right:14px;bottom:80px;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:none;z-index:5}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
</style>
</head>
<body>
<div id="top"><button class="btn" id="back" style="display:none">←</button><div class="t" id="title">FoundryKin<small>v0.7.0</small></div><button class="btn pri" id="ok" style="display:none" aria-label="Сохранить в пак">✓ В пак</button></div>
<div id="screens">
<section class="screen on" id="s-home">
<button class="btn pri big" data-go="create">Create</button>
<button class="btn big" data-go="settings">Настройки</button>
</section>
<section class="screen" id="s-create">
<h2>Текстур-паки</h2>
<div id="packList"></div>
<h2>Новый пак</h2>
<p class="lbl">Название (латиницей)</p><input type="text" id="cName" value="my_pack" autocapitalize="off" autocomplete="off" spellcheck="false">
<p class="lbl">Описание</p><input type="text" id="cDesc" value="Текстуры FoundryKin">
<p class="lbl">Версия</p><input type="text" id="cVer" value="1.0.0">
<div class="row"><button class="btn pri" id="cGo">Создать пак</button></div>
</section>
<section class="screen" id="s-pack">
<p class="lbl" id="pInfo"></p>
<div id="texList"></div>
<div class="row"><button class="btn" id="pZip">Скачать .mcpack</button><button class="btn" id="pDel">Удалить пак</button></div>
</section>
<section class="screen" id="s-add"><iframe id="editor" title="Редактор текстур" data-src="index.html"></iframe></section>
<section class="screen" id="s-settings">
<h2>Тема</h2>
<select id="sTheme"><option value="auto">Как в системе</option><option value="light">Светлая</option><option value="dark">Тёмная</option></select>
<div class="row"><button class="btn" id="sExport">Скачать данные паков (.json)</button><button class="btn" id="sClear">Удалить все паки</button></div>
</section>
</div>
<div class="bar" id="bar"><button class="btn pri" id="addBtn">+ Add texture</button></div>
<div id="msg"></div>
<script>
(function(){
var KEY='fk070_packs',SKEY='fk070_settings';
var $=function(s){return document.querySelector(s)};
function load(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v||d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){say('Не удалось сохранить: '+e.message);return false}}
var data=load(KEY,{active:null,packs:[]});
var settings=load(SKEY,{theme:'auto'});
var stack=['home'],mt=null;
function say(t){var m=$('#msg');m.textContent=t||'';m.style.display=t?'block':'none';clearTimeout(mt);if(t)mt=setTimeout(function(){m.style.display='none'},3500)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function active(){return data.packs.filter(function(p){return p.id===data.active})[0]||null}
function applyTheme(){var t=settings.theme;if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}
function uuid(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)});
}
var TITLES={home:'FoundryKin<small>v0.7.0</small>',create:'Create',settings:'Настройки',add:'Add texture'};
function render(){
  var name=stack[stack.length-1],p=active();
  document.querySelectorAll('.screen').forEach(function(s){s.classList.toggle('on',s.id==='s-'+name)});
  $('#title').innerHTML=name==='pack'?esc(p?p.name:'Пак'):TITLES[name];
  $('#back').style.display=stack.length>1?'inline-flex':'none';
  $('#ok').style.display=name==='add'?'inline-flex':'none';
  $('#bar').classList.toggle('on',name==='pack');
  if(name==='create')renderPacks();
  if(name==='pack')renderTex();
  if(name==='add'){var f=$('#editor');if(!f.getAttribute('src'))f.setAttribute('src',f.dataset.src)}
  say('');
}
function go(n){stack.push(n);render()}
$('#back').onclick=function(){if(stack.length>1){stack.pop();render()}};
document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){go(b.dataset.go)}});
$('#addBtn').onclick=function(){if(!active()){say('Сначала выбери пак.');return}go('add')};
function renderPacks(){
  var box=$('#packList');
  if(!data.packs.length){box.innerHTML='<p class="lbl">Паков пока нет. Создай первый ниже.</p>';return}
  box.innerHTML=data.packs.map(function(p){
    return '<div class="card click" data-id="'+p.id+'"><b>'+esc(p.name)+' <small>v'+esc(p.version)+'</small></b><span class="lbl">'+esc(p.desc)+' · текстур: '+p.textures.length+'</span></div>';
  }).join('');
}
$('#packList').addEventListener('click',function(e){
  var c=e.target.closest('.card');if(!c)return;
  data.active=c.dataset.id;save(KEY,data);go('pack');
});
$('#cGo').onclick=function(){
  var name=$('#cName').value.trim().replace(/[^A-Za-z0-9_\- ]/g,'');
  if(!name){say('Введи название латиницей.');return}
  var p={id:uuid(),name:name,desc:$('#cDesc').value.trim(),version:$('#cVer').value.trim()||'1.0.0',textures:[]};
  data.packs.push(p);data.active=p.id;
  if(save(KEY,data))go('pack');
};
function renderTex(){
  var p=active(),box=$('#texList');
  if(!p){box.innerHTML='';return}
  $('#pInfo').textContent=p.desc+' · v'+p.version+' · изменённых текстур: '+p.textures.length;
  if(!p.textures.length){box.innerHTML='<p class="lbl">Пока пусто. Нажми «+ Add texture», выбери блок, измени текстуру и нажми «✓ В пак».</p>';return}
  box.innerHTML=p.textures.map(function(t,i){
    return '<div class="card"><div class="tx"><img src="'+t.data+'" alt=""><div>'+esc(t.path)+'</div></div>'+
      '<div class="row"><button class="btn" data-a="png" data-i="'+i+'">Экспорт PNG</button><label class="btn" for="rep'+i+'">Заменить</label><input type="file" id="rep'+i+'" accept="image/png" data-a="rep" data-i="'+i+'"><button class="btn" data-a="del" data-i="'+i+'">Удалить</button></div></div>';
  }).join('');
}
$('#texList').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var p=active(),i=+b.dataset.i;if(!p||!p.textures[i])return;
  if(b.dataset.a==='del'){p.textures.splice(i,1);save(KEY,data);renderTex()}
  if(b.dataset.a==='png')download(dataBlob(p.textures[i].data),p.textures[i].path.split('/').pop()+'.png');
});
$('#texList').addEventListener('change',function(e){
  var inp=e.target;if(inp.dataset.a!=='rep'||!inp.files[0])return;
  var p=active(),i=+inp.dataset.i,r=new FileReader();
  r.onload=function(){p.textures[i].data=r.result;save(KEY,data);renderTex();say('Текстура заменена.')};
  r.readAsDataURL(inp.files[0]);
});
function dataBlob(u){var a=u.split(','),bin=atob(a[1]),n=bin.length,u8=new Uint8Array(n);while(n--)u8[n]=bin.charCodeAt(n);return new Blob([u8],{type:'image/png'})}
function download(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)}
$('#ok').onclick=function(){
  var p=active();if(!p){say('Нет активного пака.');return}
  try{
    var d=$('#editor').contentDocument,cv=d.querySelector('#ed'),nm=d.querySelector('#name');
    if(!cv)throw new Error('редактор ещё не загрузился');
    var n=((nm&&nm.value)||'texture').trim().replace(/[^A-Za-z0-9_\-]/g,'_')||'texture';
    var path='blocks/'+n;
    p.textures=p.textures.filter(function(t){return t.path!==path});
    p.textures.push({path:path,data:cv.toDataURL('image/png')});
    if(save(KEY,data))say('Сохранено в пак «'+p.name+'»: '+path);
  }catch(e){say('Не удалось взять текстуру из редактора: '+e.message)}
};
$('#pZip').onclick=function(){
  var p=active();if(!p)return;
  if(typeof JSZip==='undefined'){say('JSZip недоступен офлайн.');return}
  var v=p.version.split('.').map(function(n){return parseInt(n,10)||0});while(v.length<3)v.push(0);v=v.slice(0,3);
  var z=new JSZip();
  z.file('manifest.json',JSON.stringify({format_version:2,header:{name:p.name,description:p.desc,uuid:uuid(),version:v,min_engine_version:[1,20,0]},modules:[{type:'resources',uuid:uuid(),version:v}]},null,2));
  p.textures.forEach(function(t){z.file('textures/'+t.path+'.png',t.data.split(',')[1],{base64:true})});
  z.generateAsync({type:'blob'}).then(function(b){download(b,p.name+'.mcpack');say('Скачан '+p.name+'.mcpack')},function(e){say('Ошибка архива: '+e.message)});
};
$('#pDel').onclick=function(){
  var p=active();if(!p||!confirm('Удалить пак «'+p.name+'»?'))return;
  data.packs=data.packs.filter(function(x){return x.id!==p.id});data.active=null;save(KEY,data);stack.pop();render();
};
$('#sTheme').value=settings.theme;
$('#sTheme').onchange=function(){settings.theme=this.value;save(SKEY,settings);applyTheme()};
$('#sExport').onclick=function(){download(new Blob([JSON.stringify(data)],{type:'application/json'}),'foundrykin-packs.json')};
$('#sClear').onclick=function(){if(confirm('Удалить все паки?')){data={active:null,packs:[]};save(KEY,data);say('Паки удалены.')}};
applyTheme();render();
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</body>
</html>
